server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;

    # FastAPI backend — endpoints all live under /api/* already, so we forward
    # the prefix through unchanged (proxy_pass path ends in /api/).
    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/mappings/from-url can take 60–180s on t3.small: URL fetch
        # (with fallbacks) + two Claude round-trips + DB write. 120s was
        # producing 504s. Bump generously so Claude cold-latency spikes
        # don't kill the request.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Next.js (server-rendered pages + static assets)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Next.js HMR websocket during dev; harmless in prod.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
