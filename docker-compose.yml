services:
  postgres:
    image: postgres:18-alpine
    container_name: mi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_intel
      POSTGRES_USER: mi
      # Must be set in .env. The :? makes compose refuse to start rather than
      # silently bring up a database with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume, not a bind mount — the data must survive image rebuilds
      # and must not be sitting in the repo directory.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api waits on this, so it never starts against a database that is still
      # replaying WAL after a restart.
      test: ["CMD-SHELL", "pg_isready -U mi -d market_intel"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the api container needs it.
    expose:
      - "5432"
    networks:
      - miweb

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mi:${POSTGRES_PASSWORD}@postgres:5432/market_intel
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # data/ still mounts read-write. Postgres is the live database now, but
      # this directory holds the nightly backups and the pre-cutover SQLite
      # file, which is the rollback path and is kept deliberately.
      - ./data:/app/data
    expose:
      - "8001"
    networks:
      - miweb

  web:
    build:
      context: ./ui-next
      dockerfile: Dockerfile
      args:
        # Empty string = same-origin. Paths in ui-next/lib/api.ts already start
        # with "/api/...", so we set NEXT_PUBLIC_API_URL="" and let nginx route
        # /api/* to the api container. Setting "/api" would double-prefix.
        NEXT_PUBLIC_API_URL: ""
    container_name: mi-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Runtime env for Next.js server-side fetches. Node needs an absolute URL,
      # so we bypass nginx and hit the api container directly over the Docker
      # network. Browser code still uses same-origin via NEXT_PUBLIC_API_URL="".
      API_URL_INTERNAL: http://api:8001
    expose:
      - "3000"
    networks:
      - miweb

  nginx:
    image: nginx:1.27-alpine
    container_name: mi-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - miweb

volumes:
  pgdata:

networks:
  miweb:
    driver: bridge
