services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mi-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount the host's data/ read-write so the SQLite DB persists across
      # container rebuilds and manual-mapping writes stay durable.
      - ./data:/app/data
    expose:
      - "8001"
    networks:
      - miweb

  web:
    build:
      context: ./ui-next
      dockerfile: Dockerfile
      args:
        # Empty string = same-origin. Paths in ui-next/lib/api.ts already start
        # with "/api/...", so we set NEXT_PUBLIC_API_URL="" and let nginx route
        # /api/* to the api container. Setting "/api" would double-prefix.
        NEXT_PUBLIC_API_URL: ""
    container_name: mi-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Runtime env for Next.js server-side fetches. Node needs an absolute URL,
      # so we bypass nginx and hit the api container directly over the Docker
      # network. Browser code still uses same-origin via NEXT_PUBLIC_API_URL="".
      API_URL_INTERNAL: http://api:8001
    expose:
      - "3000"
    networks:
      - miweb

  nginx:
    image: nginx:1.27-alpine
    container_name: mi-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - miweb

networks:
  miweb:
    driver: bridge
